name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The suite tests the schema deployed in Supabase, which changes with the
  # migrations of the web repository and not with this one: run it by hand
  # after applying a migration
  workflow_dispatch:

jobs:
  static:
    name: Types, lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  api:
    name: API tests against Supabase
    needs: static
    runs-on: ubuntu-latest
    # Every run signs in with the same two test users, and each test only
    # touches rows it created, so runs do not need to wait for each other
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      API_USER_A_EMAIL: ${{ secrets.API_USER_A_EMAIL }}
      API_USER_A_PASSWORD: ${{ secrets.API_USER_A_PASSWORD }}
      API_USER_B_EMAIL: ${{ secrets.API_USER_B_EMAIL }}
      API_USER_B_PASSWORD: ${{ secrets.API_USER_B_PASSWORD }}
    outputs:
      report-uploaded: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # No browsers to install: the tests only make HTTP requests
      - run: npm ci
      - run: npm test
      # Allure draws the trend between runs from this file, which every run
      # publishes next to the report. The first run finds nothing to bring back
      - name: Bring back the history of the published report
        if: ${{ !cancelled() }}
        run: >
          curl -fsSL --retry 3 -o allure-history.jsonl
          https://fredysan25.github.io/Bitacora360-API-testing/allure-history.jsonl
          || rm -f allure-history.jsonl
      # The site has the Allure report at the root and the Playwright one,
      # which has more detail to debug a failure, under /playwright
      - name: Build the site
        if: ${{ !cancelled() }}
        run: |
          npx allure generate allure-results
          mkdir site
          cp -r allure-report/. site
          cp -r playwright-report site/playwright
          cp allure-history.jsonl site
      # The site is public, so it is only published after checking that the
      # reporter in support/ redacted the passwords and the tokens of the test
      # users. The Playwright report embeds its data as a zip, which a plain
      # grep cannot read
      - name: Check that the site does not contain passwords or tokens
        id: check
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          grep -o 'data:application/zip;base64,[A-Za-z0-9+/=]*' site/playwright/index.html \
            | cut -d, -f2 | base64 -d > "$RUNNER_TEMP/report.zip"
          unzip -q "$RUNNER_TEMP/report.zip" -d "$RUNNER_TEMP/report"
          if grep -rqF -e "$API_USER_A_PASSWORD" -e "$API_USER_B_PASSWORD" "$RUNNER_TEMP/report" site; then
            echo "::error::The site contains the password of a test user"
            exit 1
          fi
          # An access token is a JWT, and a refresh token only stands out by its key
          if grep -rqE -e 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}' \
            -e 'refresh_token[\\"]*: *[\\"]*[A-Za-z0-9_-]' "$RUNNER_TEMP/report" site; then
            echo "::error::The site contains a token"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        id: upload
        if: ${{ !cancelled() && steps.check.outcome == 'success' && github.ref == 'refs/heads/main' }}
        with:
          path: site/

  report:
    name: Publish the report to GitHub Pages
    needs: api
    # Also after a failed run: that is when the report is most useful
    if: ${{ !cancelled() && needs.api.outputs.report-uploaded == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
